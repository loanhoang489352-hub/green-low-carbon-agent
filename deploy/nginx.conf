# ========== 绿色低碳智能体 - Nginx 反向代理模板 (P5-J) ==========
# 用途: 反向代理 8000 端口的 Python Web 服务,添加 TLS 终止、限流、压缩、metrics 限内网
# 部署:
#   1. cp deploy/nginx.conf /etc/nginx/sites-available/green-agent.conf
#   2. ln -s /etc/nginx/sites-available/green-agent.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
# 测试:
#   curl -H "Host: green-agent.example.com" https://<nginx-host>/api/health

# ========== 上游:Python Web 服务 ==========
upstream green_agent_backend {
    # 单一后端;若多实例则改为 ip_hash + 多个 server
    server 127.0.0.1:8000;
    keepalive 32;       # 启用 keepalive 连接池,降低 upstream TCP 握手开销
}

# ========== 限流区(P5-I 兜底) ==========
# P5-I 已在应用层做 60 req/60s/IP 限流;nginx 层再加一层,防 SYN flood
limit_req_zone $binary_remote_addr zone=green_agent_per_ip:10m rate=30r/s;

# ========== HTTPS server ==========
server {
    listen 443 ssl http2;
    server_name green-agent.example.com;

    # TLS 证书(Let's Encrypt 或自签)
    ssl_certificate     /etc/letsencrypt/live/green-agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/green-agent.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS(强制 HTTPS 1 年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客户端 body 大小(P5-B: audit_log 可能含 detail,放大到 1MB)
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 访问日志(P5-B 格式:包含 trace_id 需在 upstream 设置 X-B3-TraceId)
    log_format green_agent '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct=$upstream_connect_time '
                           'uht=$upstream_header_time urt=$upstream_response_time '
                           'req_id=$request_id';
    access_log /var/log/nginx/green-agent.access.log green_agent;
    error_log  /var/log/nginx/green-agent.error.log warn;

    # ========== /api/* 业务端点 ==========
    location /api/ {
        # nginx 层限流(兜底)
        limit_req zone=green_agent_per_ip burst=60 nodelay;
        limit_req_status 429;

        # 反向代理
        proxy_pass http://green_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P5-D: 透传 Authorization / X-Session-Id 给 Python 鉴权
        proxy_pass_request headers on;

        # 超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;     # LLM 调用 30s + 缓冲
        proxy_read_timeout    60s;

        # 缓冲(关掉以支持流式响应,虽然当前不流)
        proxy_buffering off;

        # ========== 限内网:Metrics / Health(可选) ==========
        # /api/metrics 只允许内网(127.0.0.1 / 监控网段)
        # 取消注释并调整 allow 网段启用
        # if ($uri = "/api/metrics") {
        #     allow 127.0.0.1;
        #     allow 10.0.0.0/8;
        #     allow 172.16.0.0/12;
        #     allow 192.168.0.0/16;
        #     deny  all;
        # }
    }

    # ========== / 静态(Web UI) ==========
    location / {
        proxy_pass http://green_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # 静态资源缓存(1 小时)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://green_agent_backend;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # ========== 健康检查专端点(给 LB / K8s 探活,跳过限流) ==========
    location = /api/health {
        access_log off;                # 健康检查不写访问日志(减少噪音)
        proxy_pass http://green_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }
    location = /api/ready {
        access_log off;
        proxy_pass http://green_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # ========== 通用错误页 ==========
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name green-agent.example.com;
    return 301 https://$host$request_uri;
}
