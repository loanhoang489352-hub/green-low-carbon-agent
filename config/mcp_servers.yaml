# MCP (Model Context Protocol) Server 配置
# 启动时,MCP 客户端会连接所有 enabled 的 server,发现其 tool,
# 自动注册到本地 ToolRegistry(供 chat_enhanced / Skills 调用)
#
# 支持 transport(2026-07):
#   - stdio:           JSON-RPC 2.0 over stdio(每行一个 JSON),用 command + args 启动子进程
#   - streamable-http: MCP 2025-11-25 Streamable HTTP,用 url + headers 调远端 server
#
# P11.C 新增:占位符展开 — 任何字符串字段中的 ${ENV_VAR} 会从环境变量取值
# 未找到的 env 保留原样(${VAR_NAME}),便于排查
# 例如:Authorization: Bearer ${GITHUB_TOKEN}
#
# 添加新 server: 复制下面一条,按 transport 改字段

mcp_servers:

  # === 内置: mock MCP server(测试用,返回固定数据) ===
  - name: mock_server
    description: 内置 mock MCP server,提供 echo/weather/carbon 3 个测试 tool
    enabled: true
    transport: stdio
    command: python
    args:
      - scripts/mcp_mock_server.py
    connect_timeout_s: 10.0
    request_timeout_s: 30.0

  # === 示例: HTTP MCP server(若起本地 mock HTTP server,可启用) ===
  # P10.B: 启动 scripts/mock_http_mcp_server.py 后,改 enabled: true
  - name: mock_http_server
    description: 内置 mock Streamable HTTP MCP server(echo/weather/carbon,本地测试)
    enabled: false
    transport: streamable-http
    url: http://127.0.0.1:8765/mcp
    origin: https://green-low-carbon-agent.local
    connect_timeout_s: 10.0
    request_timeout_s: 30.0

  # ============================================================
  # P11.C 真实 MCP server 模板(默认 enabled: false,需用户主动开)
  # ============================================================

  # === GitHub MCP server(github/github-mcp-server 官方) ===
  # GitHub 托管的 Streamable HTTP 端点: https://api.githubcopilot.com/mcp/
  # 需 GITHUB_TOKEN env(fine-grained PAT,至少包含 repo + read 权限)
  # 启用后,agent 可调:create_issue / list_repos / get_file_contents / search_code 等
  - name: github
    description: GitHub 官方 MCP(Streamable HTTP) — create_issue / list_repos / get_file_contents
    enabled: false
    transport: streamable-http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: Bearer ${GITHUB_TOKEN}
    origin: https://green-low-carbon-agent.local
    connect_timeout_s: 10.0
    request_timeout_s: 30.0
    verify_ssl: true

  # === Notion MCP server(官方 OAuth) ===
  # Notion 官方 MCP: https://mcp.notion.com/mcp
  # 首次启用需走 OAuth 2.1 授权(client_credentials / authorization_code)
  # 配置前先去 https://www.notion.so/profile/integrations 创建 internal integration,
  # 拿到 NOTION_CLIENT_ID / NOTION_CLIENT_SECRET
  # 注:StreamableHTTPClient 当前 OAuth 为 stub(自动 bearer 注入,refresh 留 TODO)
  # 真实用前可手工调 notion OAuth 拿 token 后填入下方 oauth_token
  - name: notion
    description: Notion 官方 MCP(Streamable HTTP) — 读 / 写 Notion 页面与数据库
    enabled: false
    transport: streamable-http
    url: https://mcp.notion.com/mcp
    origin: https://green-low-carbon-agent.local
    connect_timeout_s: 10.0
    request_timeout_s: 30.0
    verify_ssl: true
    # OAuth 2.1(填入后 oauth_token 优先级最高)
    # oauth_token: ${NOTION_TOKEN}
    # oauth_token_url: https://api.notion.com/v1/oauth/token
    # oauth_client_id: ${NOTION_CLIENT_ID}
    # oauth_client_secret: ${NOTION_CLIENT_SECRET}

  # === 高德地图 MCP(若安装了对应 server,启用) ===
  # - name: amap_mcp
  #   description: 高德地图 MCP — 提供地理编码/路线规划
  #   enabled: false
