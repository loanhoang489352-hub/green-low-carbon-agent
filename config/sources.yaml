# 政策与知识数据源(P4-E 重写,2026-06)
# 选取原则:实测可通(精细 headers + 直连,2026-06 香港 IP 测试)
#   - .gov.cn 系列全部 SSL 失败(政府站服务器端拒绝非大陆 IP)
#   - 改用商业媒体转载 + 行业协会 + 国际研究机构

# type 字段含义(PolicyUpdater 据此走不同抓取策略)
#   rss       - 公开 RSS/Atom feed,标准化 XML
#   html      - 静态 HTML 列表页(需 BS4 解析)
#   api       - JSON API
#   standard  - 学术/标准机构首页
policy_sources:
  # ====== 政府权威源(KB-v4 增补,大陆 IP 实测可通) ======
  - name: "生态环境部-双碳专题"
    url: "https://www.mee.gov.cn/ywgz/ydqhbh/"
    type: "html"
    region: "national"
    category: "政府-双碳"
    enabled: true
    check_interval_hours: 24
    note: "生态环境部双碳专题,最权威的官方源,含低碳关键词"
  - name: "生态环境部-新闻发布"
    url: "https://www.mee.gov.cn/ywdt/xwfb/"
    type: "html"
    region: "national"
    category: "政府-气候"
    enabled: true
    check_interval_hours: 24
    note: "生态环境部新闻发布,政策动态"
  - name: "国务院-最新政策"
    url: "https://www.gov.cn/zhengce/zuixin/"
    type: "html"
    region: "national"
    category: "政府-国务院"
    enabled: true
    check_interval_hours: 12
    note: "国务院政策原文,最高权威"
  - name: "国标检索-碳足迹"
    url: "https://openstd.samr.gov.cn/bzgk/std"
    type: "html"
    region: "national"
    category: "标准-碳足迹"
    enabled: true
    check_interval_hours: 168
    note: "国家标准化管理委员会,GB/T 24067 等"
  - name: "国家统计局-数据"
    url: "https://www.stats.gov.cn/sj/ndsj/"
    type: "html"
    region: "national"
    category: "数据-统计"
    enabled: true
    check_interval_hours: 168
    note: "能源/环境统计年鉴"
  - name: "北京生态环境局-新闻"
    url: "https://sthjj.beijing.gov.cn/bjhrb/index/index.html"
    type: "html"
    region: "beijing"
    category: "政府-地方"
    enabled: true
    check_interval_hours: 24
    note: "北京地方政策"
  - name: "广州生态环境局"
