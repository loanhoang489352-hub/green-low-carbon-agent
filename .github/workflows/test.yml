name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Quick smoke (import check)
      run: |
        python -c "import sys; sys.path.insert(0, 'src'); import main; print('main import OK')"
        python -c "import sys; sys.path.insert(0, 'src'); from agent.langgraph_agent import LangGraphAgent; print('langgraph import OK')"

    - name: Run P4 tests (P0–P4 核心验证)
      run: |
        python -m pytest tests/test_p4*.py -v --tb=short 2>&1 | tee pytest-p4.log
        echo "exit=$?" >> pytest-p4.log

    - name: Upload pytest logs (always, for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-logs
        path: pytest-p4.log
        if-no-files-found: ignore
