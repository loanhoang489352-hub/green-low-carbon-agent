name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run P4 tests
      run: pytest tests/test_p4*.py -v --tb=short

    - name: Run full test suite
      run: pytest tests/ -v --tb=short --ignore=tests/test_p4g_e2e.py

    - name: E2E smoke test
      run: python tests/manual_e2e_verify.py
