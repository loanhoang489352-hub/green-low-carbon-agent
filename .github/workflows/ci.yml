name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 取消同一 ref 上 in-progress 的旧 run,避免双跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"
  LOG_LEVEL: "INFO"

jobs:
  # ============================================================
  # Job 1: 单测 + 集成测试
  # ============================================================
  build-and-test:
    name: Build & Test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # 如未来需要外部服务(Redis / Postgres)可加 services: 块
      dummy:
        image: alpine:3.19
        options: --health-cmd "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Free disk space
        run: |
          # CI runner 默认只有 ~14GB,PaddleOCR/PaddlePaddle 会爆盘,提前清掉大件
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # 先装 dev 依赖(更小),再装主依赖(避免 PaddlePaddle 拖死 cache 命中)
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          pip --version

      - name: Quick import smoke
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import main; print('main import OK')"
          python -c "import sys; sys.path.insert(0, 'src'); from agent.langgraph_agent import LangGraphAgent; print('langgraph import OK')"
          python -c "import sys; sys.path.insert(0, 'src'); from server.app import init_app; print('server init OK')"

      - name: Run full test suite (skip heavy)
        # -x 首个失败即停,--ignore 跳过需要 live server / OCR 的测试
        # -k "not paddle" 排除 PaddlePaddle 路径(避免 CI 拉 ONNX 触发 OOM)
        # -k "not paddleocr" 同上兜底
        run: |
          set -o pipefail
          mkdir -p .pytest-cache
          pytest tests/ -v --tb=short -x \
            -k "not paddle and not paddleocr" \
            --ignore=tests/test_p6s15_tools_skills.py \
            --ignore=tests/test_ocr_engine.py \
            --ignore=tests/test_mcp_streamable.py \
            --ignore=tests/test_skills_compliance.py \
            2>&1 | tee pytest-main.log
          echo "exit=$?" >> pytest-main.log

      - name: Run targeted live-server tests
        # 这些需要 boot 起来的 server,在单元测试套件之外单独跑,先用 mock 模式
        run: |
          set -o pipefail
          export LLM_MOCK=true
          export USE_MOCK_LLM=true
          export RUN_LIVE_SERVER_TESTS=true
          pytest tests/test_ocr_engine.py tests/test_mcp_streamable.py tests/test_skills_compliance.py \
            -v --tb=short \
            2>&1 | tee pytest-live.log || echo "Some live-server tests may be skipped in CI (expected)"
          echo "exit=$?" >> pytest-live.log

      - name: Upload pytest logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            pytest-main.log
            pytest-live.log
          if-no-files-found: ignore

      - name: Run ruff lint
        run: |
          ruff check src/ tests/ --output-format=github || echo "lint warnings only"

  # ============================================================
  # Job 2: Docker build + smoke test
  # ============================================================
  docker-build:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.13 (for local scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build image
        run: |
          docker build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --tag green-agent:test \
            --tag green-agent:${{ github.sha }} \
            .
          docker images | grep green-agent

      - name: Save Docker cache
        run: |
          mkdir -p /tmp/.buildx-cache-new
          docker buildx build --cache-to type=local,dest=/tmp/.buildx-cache-new --tag green-agent:test --load . || true
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Prepare LLM_MOCK env file
        run: |
          cat > .env.ci <<EOF
          # CI smoke 用 mock LLM,避免真实 API key 暴露 / 限流
          LLM_MOCK=true
          USE_MOCK_LLM=true
          LOG_LEVEL=WARNING
          ENV=ci
          # secrets 占位符 — 真部署时由 GitHub repo settings 注入
          # MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
          # DEDUCT_API_KEY=${{ secrets.DEDUCT_API_KEY }}
          # OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          # AMAP_API_KEY=${{ secrets.AMAP_API_KEY }}
          # HF_TOKEN=${{ secrets.HF_TOKEN }}
          EOF
          echo "Env file:"
          cat .env.ci

      - name: Start container
        run: |
          docker run -d \
            --name green-agent \
            -p 8000:8000 \
            --env-file .env.ci \
            -e LOG_LEVEL=WARNING \
            green-agent:test
          echo "Container started, id=$(docker ps -q --filter name=green-agent)"

      - name: Wait for boot (40s, generous for cold ChromaDB + PaddleOCR lazy init)
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/api/ready > /dev/null 2>&1; then
              echo "Service ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Service did NOT become ready in 40s"
          docker logs green-agent | tail -80
          exit 1

      - name: Smoke test - GET /api/ready
        run: |
          echo "== GET /api/ready =="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:8000/api/ready
          echo ""
          # 期望 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/ready)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/ready returned $STATUS"
            docker logs green-agent | tail -50
            exit 1
          fi
          echo "PASS: /api/ready -> 200"

      - name: Smoke test - GET /api/health
        run: |
          echo "== GET /api/health =="
          curl -sS http://localhost:8000/api/health
          echo ""
          HEALTH=$(curl -s http://localhost:8000/api/health)
          echo "$HEALTH" | grep -q '"status"' || { echo "FAIL: missing status field"; exit 1; }
          # 期望 status=ok(或 healthy/degraded,具体看 server 实现)
          echo "$HEALTH" | grep -qE '"status"\s*:\s*"(ok|healthy|degraded)"' \
            || { echo "FAIL: status not ok/healthy/degraded"; exit 1; }
          echo "PASS: /api/health"

      - name: Smoke test - POST /api/chat
        run: |
          echo "== POST /api/chat =="
          RESP=$(curl -sS -w "\n---HTTP_STATUS:%{http_code}" \
            -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"你好"}')
          echo "$RESP"
          STATUS=$(echo "$RESP" | tail -1 | sed 's/.*HTTP_STATUS://')
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/chat returned HTTP $STATUS"
            docker logs green-agent | tail -50
            exit 1
          fi
          echo "PASS: /api/chat -> 200"

      - name: Show container logs
        if: always()
        run: |
          echo "== docker logs (last 30 lines) =="
          docker logs green-agent | tail -30

      - name: Save container logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-smoke.log
          if-no-files-found: ignore

      - name: Stop & remove container
        if: always()
        run: |
          docker stop green-agent 2>/dev/null || true
          docker rm green-agent 2>/dev/null || true
          echo "Container cleaned up"